background:
{
  type = "gradient";
  topColor = { r = 255; g = 255; b = 255; };
  bottomColor = { r = 0; g = 0; b = 0; };
};

camera:
{
  position = { x = 0.0; y = 0.0; z = 0.0; };
  direction = { x = 0.0; y = 0.0; z = -1.0; };
  fov = 60.0;
};

lights:
{
  ambient = (
    { color = { r = 255; g = 255; b = 255; }; intensity = 0.2; }
  );
};