// Test scene — exercises the universal Phong refactor + AO together.
//
// Six spheres in a row on a grey floor against a close back wall.
// Reading left to right:
//   1. Diffuse, no Phong       — control: pure Lambert, NO highlight
//   2. Diffuse, with Phong     — Lambert + highlight (opt-in via CFG)
//   3. Glossy,  with Phong     — direct highlight + mirror reflection
//   4. Glass,   with Phong     — direct highlight + refraction
//   5. Principled metallic     — automatic Blinn-Phong + Schlick (no CFG)
//   6. Principled matte plastic — diffuse + faint F0=0.04 highlight
//
// The back wall is close to the spheres so AO darkens the contact band.
// The floor under each sphere should show a soft AO shadow.
//
// Lighting setup:
//   - One PointLight above-and-front for crisp highlights via the new
//     direct-lighting BRDF path.
//   - One directional fill light to give diffuse surfaces a soft
//     wraparound, and to give glossy/glass/metal a stable secondary
//     highlight that's visible from multiple viewpoints.
//   - A gentle ambient light so AO is readable without crushing the
//     reflective spheres in the deep shadows of indirect bounces.
//
// Background is a bright vertical gradient: metallic spheres reflect
// this sky and the glass sphere refracts it — both surfaces look like
// genuine materials instead of dark blobs.

settings:
{
  imageWidth  = 1280;
  imageHeight = 720;
  samplesPerPixel = 100;
  maxDepth    = 6;
};

background:
{
  type = "gradient";
  topColor    = { r = 180; g = 195; b = 215; };
  bottomColor = { r = 220; g = 220; b = 220; };
};

camera:
{
  position  = { x = 0.0; y = 1.2; z = 6.5; };
  direction = { x = 0.0; y = -0.15; z = -1.0; };
  fov       = 60.0;
};

primitives:
{
  // Floor and back wall — both diffuse light grey, no Phong on them so
  // they stay neutral and don't distract from the spheres.
  planes = (
    { axis = "Y"; position = -1.0;
      material = { type = "diffuse";
                   albedo = { r = 210; g = 210; b = 215; }; }; },
    // Back wall: checker pattern. The glass sphere (#4) refracts this
    // through its body — you should see the squares inverted and curved
    // in its center, and reflected on the rim where Schlick Fresnel
    // dominates over refraction.
    { axis = "Z"; position = -3.5;
      material = { type = "textured";
                   albedo  = { r = 255; g = 255; b = 255; };
                   texture = { type = "checker";
                               odd  = { r = 30;  g = 30;  b = 30;  };
                               even = { r = 220; g = 220; b = 220; };
                               scale = 4.0; }; }; }
  );

  spheres = (
    // 1. Diffuse pur — pas de Phong, pas de highlight (référence)
    { center = { x = -4.5; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "diffuse";
                   albedo = { r = 220; g = 70; b = 70; }; }; },

    // 2. Diffuse + Phong — highlight blanc bien centré
    { center = { x = -2.7; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "diffuse";
                   albedo   = { r = 230; g = 140; b = 40; };
                   specular = { r = 255; g = 255; b = 255; };
                   shininess = 64.0; }; },

    // 3. Glossy + Phong — highlight large + reflet flou de la scène
    //    Shininess réduite à 64 pour que le highlight soit visible depuis
    //    plusieurs angles (donc aussi dans les reflets voisins).
    { center = { x = -0.9; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "glossy"; fuzz = 0.05;
                   albedo   = { r = 90; g = 200; b = 220; };
                   specular = { r = 255; g = 255; b = 255; };
                   shininess = 64.0; }; },

    // 4. Glass + Phong — highlight visible + refraction du fond clair
    //    Shininess à 96 (au lieu de 256) pour que le highlight ne soit
    //    pas réduit à un pixel ; le verre paraît verre, pas violet.
    { center = { x = 0.9; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "glass"; refractionIndex = 1.45;
                   tint = { r = 240; g = 240; b = 255; };
                   specular = { r = 255; g = 255; b = 255; };
                   shininess = 96.0; }; },

    // 5. Principled metallic — highlight teinte baseColor (or chaud)
    //    AUCUNE clef specular dans le CFG : Principled calcule lui-même
    //    son F0 = baseColor (metallic=1) et sa shininess depuis roughness.
    //    Avec roughness=0.15, l'aspect est doré-poli, pas miroir parfait.
    { center = { x = 2.7; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "principled";
                   baseColor = { r = 255; g = 195; b = 120; };
                   metallic = 1.0; roughness = 0.15; alpha = 1.0; }; },

    // 6. Principled diélectrique mat — léger highlight blanc-ish (F0=0.04)
    //    posé sur un diffus quasi-Lambert grâce à roughness=0.8.
    { center = { x = 4.5; y = -0.3; z = -1.5; }; radius = 0.7;
      material = { type = "principled";
                   baseColor = { r = 110; g = 200; b = 110; };
                   metallic = 0.0; roughness = 0.8; alpha = 1.0; }; }
  );
};

lights:
{
  // Ambient doux pour ne pas écraser l'AO ni les zones d'ombre indirecte
  // sur les sphères réflectives.
  ambient = (
    { color = { r = 255; g = 255; b = 255; }; intensity = 0.12; }
  );

  // Fill light directionnelle : donne du Lambert wraparound aux diffus
  // et un second highlight stable aux glossy/glass/metal qui reste
  // visible depuis les voisins (couvre la limitation Whitted+Phong sur
  // les bounces indirects).
  directional = (
    { direction = { x = -0.3; y = -1.0; z = -0.5; };
      color     = { r = 255; g = 250; b = 240; };
      intensity = 0.4; }
  );

  // PointLight unique pour le highlight déterministe principal — la voie
  // BRDF directe qu'on a câblée dans la refacto.
  point = (
    { position  = { x = 1.5; y = 3.2; z = 2.0; };
      color     = { r = 255; g = 245; b = 230; };
      intensity = 28.0; }
  );
};

world:
{
  // AO suffisamment agressive pour bien voir les bandes de contact
  // sphère-sol et sphère-mur. radius = 1.2 capture les occluders proches.
  ambientOcclusion = {
    enabled = true;
    samples = 32;
    radius = 1.2;
    intensity = 0.75;
  };
};
