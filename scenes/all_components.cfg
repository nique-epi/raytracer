// Comprehensive test scene — exercises every implemented feature:
//   Primitives : sphere, plane, cylinder, cone
//   Lights     : ambient + directional
//   Materials  : explicit diffuse / glossy / glass materials
//   Camera     : perspective with custom position / direction / FOV

settings:
{
  imageWidth  = 1920;
  imageHeight = 1080;
  samplesPerPixel = 32;
  maxDepth    = 10;
};

background:
{
  type = "gradient";
  bottomColor = { r = 235; g = 238; b = 245; };
  topColor = { r = 115; g = 160; b = 240; };
};

camera:
{
  position  = { x = 0.0; y = 4.0; z = 12.0; };
  direction = { x = 0.0; y = -0.3; z = -1.0; };
  fov       = 60.0;
};

primitives:
{
  // ── Planes ──────────────────────────────────────────────────────────────
  planes = (
    // Floor: light grey
    { axis = "Y"; position = -1.5;
      material = { type = "diffuse"; albedo = { r = 200; g = 200; b = 200; }; }; },
    // Back wall: dark blue
    { axis = "Z"; position = -6.0;
      material = { type = "glossy"; fuzz = 0.05;
                   albedo = { r =  50; g =  60; b =  90; }; }; }
  );

  // ── Spheres ─────────────────────────────────────────────────────────────
  spheres = (
    // Large red sphere (left)
    { center = { x = -3.5; y = 0.0; z = 0.0; }; radius = 1.5;
      material = { type = "diffuse"; albedo = { r = 220; g = 50; b = 50; }; }; },
    // Small green sphere (center)
    { center = { x =  0.0; y = 0.0; z = -1.0; }; radius = 1.0;
      material = { type = "glossy"; fuzz = 0.12;
                   albedo = { r = 60; g = 180; b = 60; }; }; },
    // Tiny glass sphere (upper right — specular/refraction test)
    { center = { x =  2.5; y = 2.5; z = -1.0; }; radius = 0.4;
      material = { type = "glass"; refractionIndex = 1.45; }; }
  );

  // ── Cylinders ───────────────────────────────────────────────────────────
  cylinders = (
    // Vertical blue cylinder (right side)
    { center = { x = 3.5; y = 0.25; z = 0.0; };
      axis   = { x = 0.0; y = 1.0;  z = 0.0; };
      radius = 0.7; height = 3.5;
      material = { type = "glossy"; fuzz = 0.08;
                   albedo = { r = 60; g = 100; b = 220; }; }; },
    // Horizontal orange cylinder (foreground, lying on floor)
    { center = { x = 0.0; y = -0.9; z = 3.0; };
      axis   = { x = 1.0; y = 0.0; z = 0.0; };
      radius = 0.5; height = 5.0;
      material = { type = "diffuse"; albedo = { r = 230; g = 130; b = 30; }; }; }
  );

  // ── Cones ───────────────────────────────────────────────────────────────
  cones = (
    // Purple cone pointing up (back center)
    { apex  = { x = -0.5; y = -1.5; z = -3.5; };
      axis  = { x =  0.0; y =  1.0; z =  0.0; };
      angle = 0.4; height = 3.0;
      material = { type = "glossy"; fuzz = 0.18;
                   albedo = { r = 160; g = 60; b = 200; }; }; },
    // Yellow-green cone pointing sideways (foreground left)
    { apex  = { x = -4.5; y =  0.0; z =  2.0; };
      axis  = { x =  1.0; y =  0.2; z =  0.0; };
      angle = 0.3; height = 2.5;
      material = { type = "diffuse"; albedo = { r = 180; g = 210; b = 40; }; }; }
  );
};

lights:
{
  ambient = (
    { color = { r = 255; g = 255; b = 255; }; intensity = 0.25; }
  );

  directional = (
    // Main light: upper-left, warm white
    { direction = { x = 1.0; y = -1.5; z = -1.0; };
      color = { r = 255; g = 245; b = 220; }; intensity = 0.9; },
    // Fill light: right side, cool blue tint
    { direction = { x = -1.0; y = -0.5; z = -0.5; };
      color = { r = 180; g = 200; b = 255; }; intensity = 0.3; }
  );
};
