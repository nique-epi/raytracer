settings:
{
  imageWidth = 800;
  imageHeight = 600;
  samplesPerPixel = 64;
  maxDepth = 10;
};

camera:
{
  position = { x = 0.0; y = 1.0; z = 5.0; };
  direction = { x = 0.0; y = -0.2; z = -1.0; };
  fov = 90.0;
};

primitives:
{
  spheres = (
    {
      center = { x = -2.5; y = 0.0; z = 0.0; };
      radius = 1.0;
      material = {
        type = "textured";
        albedo = { r = 255; g = 255; b = 255; };
        texture = {
          type = "checker";
          odd   = { r = 20;  g = 20;  b = 20;  };
          even  = { r = 220; g = 220; b = 220; };
          scale = 10.0;
        };
      };
    },
    {
      center = { x = 0.0; y = 0.0; z = 0.0; };
      radius = 1.0;
      material = {
        type = "textured";
        albedo = { r = 255; g = 200; b = 150; };
        texture = { type = "noise"; };
      };
    },
    {
      center = { x = 2.5; y = 0.0; z = 0.0; };
      radius = 1.0;
      material = {
        type = "textured";
        albedo = { r = 100; g = 180; b = 255; };
        texture = { type = "solid"; color = { r = 100; g = 180; b = 255; }; };
      };
    }
  );

  planes = (
    {
      axis = "Y";
      position = -1.0;
      material = {
        type = "textured";
        albedo = { r = 255; g = 255; b = 255; };
        texture = {
          type = "checker";
          odd   = { r = 50;  g = 50;  b = 50;  };
          even  = { r = 200; g = 200; b = 200; };
          scale = 5.0;
        };
      };
    }
  );
};

background:
{
  type = "gradient";
  topColor    = { r = 100; g = 150; b = 255; };
  bottomColor = { r = 255; g = 255; b = 255; };
};

lights:
{
  ambient = (
    { color = { r = 255; g = 255; b = 255; }; intensity = 0.3; }
  );
  directional = (
    { direction = { x = 1.0; y = -1.0; z = -1.0; }; color = { r = 255; g = 255; b = 255; }; intensity = 0.8; }
  );
};
