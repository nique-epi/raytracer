// Test scene for the `materialPreview` viewport mode WITHOUT any ILight
// source. Expected output: NOT black.
//
// MaterialPreview ignores ILight sources entirely (Blender semantics) but
// samples the background as an environment light on indirect bounces. A
// gradient background here gives the scattered rays something to pick up,
// so every diffuse primitive picks up the sky colour through one bounce.
//
// If this scene renders black, the integrator is broken — either the
// scatter recursion is dropping early, or MaterialPreview is no longer
// sampling the background on non-primary rays.

settings:
{
  imageWidth      = 800;
  imageHeight     = 600;
  samplesPerPixel = 16;
  maxDepth        = 5;
};

camera:
{
  position  = { x = 0.0; y = 1.0; z = 5.0; };
  direction = { x = 0.0; y = -0.2; z = -1.0; };
  fov       = 70.0;
};

primitives:
{
  spheres = (
    { center = { x = -1.5; y = 0.0; z = 0.0; };
      radius = 1.0;
      color  = { r = 200; g =  60; b =  60; }; },

    { center = { x =  0.0; y = 0.0; z = 0.0; };
      radius = 1.0;
      color  = { r =  60; g = 200; b =  90; }; },

    { center = { x =  1.5; y = 0.0; z = 0.0; };
      radius = 1.0;
      color  = { r =  60; g =  90; b = 220; }; }
  );

  planes = (
    { axis = "Y"; position = -1.0;
      color = { r = 200; g = 200; b = 200; }; }
  );
};

background:
{
  type        = "gradient";
  topColor    = { r =  80; g = 130; b = 230; };
  bottomColor = { r = 240; g = 240; b = 255; };
};

world =
{
  mode = "materialPreview";
};

// No `lights` block on purpose — MaterialPreview must not need any.
